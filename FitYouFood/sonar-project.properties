# Required properties
sonar.projectKey=testing-backend-dot-net
sonar.projectName=Testing Backend DotNet
sonar.projectVersion=1.0

# Optional properties
sonar.sources=./FitYouFood
sonar.language=cs
sonar.exclusions=**/*.test.cs,**/*.spec.cs
sonar.tests=./FitYouFood.Tests
sonar.test.inclusions=**/*.cs
sonar.junit.reportsPath=./TestResults

# SonarQube server information (if not passed via the scanner)
sonar.host.url=http://sonarqube:9000
sonar.login=admin
