# Required properties for SonarQube analysis
sonar.projectKey=backend-dotnet
sonar.projectName=Backend .NET
sonar.projectVersion=1.0

# Paths to the source code to be analyzed
sonar.sources=./FitYouFood
sonar.tests=./FitYouFood.Tests

# Path to the test reports
sonar.testExecutionReportPaths=./TestResults/test-coverage-report.xml

# Path to the coverage report (.coveragexml format) for analysis
sonar.coverageReportPaths=./TestResults/coverage.xml

# Exclude certain projects from the analysis
# Add this inside the .csproj file of the project you want to exclude
# <PropertyGroup>
#   <SonarQubeExclude>true</SonarQubeExclude>
# </PropertyGroup>

# Enable multi-language analysis (for analyzing JavaScript, TypeScript, etc.)
sonar.scanner.scanAll=true

# Exclude files from analysis (e.g., node_modules, generated files)
sonar.exclusions=**/node_modules/**, **/bin/**, **/obj/**, **/TestResults/**

# Exclude specific file types from the analysis
# For example, excluding JavaScript files:
sonar.exclusions=**/*.js

# Enable .NET framework-style analysis (for analyzing MSBuild projects)
sonar.cs.dotnet.visualstudio=true

# Proxy settings (if your network requires using a proxy)
#SONAR_SCANNER_OPTS="-Dhttp.proxyHost=yourProxyHost -Dhttp.proxyPort=yourProxyPort"
#HTTP_PROXY=http://yourProxyHost:yourProxyPort
#HTTPS_PROXY=http://yourProxyHost:yourProxyPort

# Code coverage parameters
# (Note: Only works with .NET Framework version of the scanner)
sonar.coverageReportPaths=./TestResults/coverage.xml

# If you're using a different coverage tool, you can configure additional coverage reports
# sonar.javascript.lcov.reportPaths=coverage/lcov-report/index-lcov-report.json

# Exclude test projects
sonar.exclusions=**/tests/**, **/*.Test.csproj

# Enable advanced analysis parameters for detecting MSBuild issues
sonar.cs.msbuild.version=16.0

# Additional optional settings
sonar.verbose=true

# If you're running SonarScanner behind a proxy, you can set this flag in the environment
# SONAR_SCANNER_OPTS="-Dhttp.proxyHost=proxyHost -Dhttp.proxyPort=proxyPort"
