input {
  file {
    path => "/path/to/your/file.yaml"
    start_position => "beginning"
    codec => yaml
  }
}

filter {
  # Jeśli plik YAML zawiera dane w strukturze JSON, możemy je przetwarzać
  # Można użyć np. filter json lub grok do dalszego przetwarzania
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "your-index-name-%{+YYYY.MM.dd}"
  }
}
