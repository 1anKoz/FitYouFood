name: Docker Compose CI/CD

# hi

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build, start and test services
      run: docker compose -f compose.yaml up --build -d

    - name: Wait for Services to Start
      run: |
        sleep 200
        docker logs $(docker ps -q -f name=sonarqube)

    - name: SonarQube Analysis (.NET)
      run: |

        docker exec -it $(docker ps -q -f name=fityoufood-app) bash -c 'export PATH="$PATH:/root/.dotnet/tools"'

        docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner begin \
          /k:"fityoufood-backend" \
          /d:sonar.host.url="${{ secrets.SONARQUBE_HOST }}" \
          /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"

        docker exec $(docker ps -q -f name=fityoufood-app) dotnet build ./FitYouFood/FitYouFood.API.csproj 

        docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"


    - name: Verify Metrics Endpoint
      run: |
        curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"
    
    - name: Tag and Push Docker Image
      run: |
        docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

    - name: Stop and Remove Services
      run: docker compose -f compose.yaml down