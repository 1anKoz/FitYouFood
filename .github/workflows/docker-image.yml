    # # Add SonarScanner to PATH
    # - name: Add .NET tools to PATH
    #   run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

    # - name: SonarQube Analysis (.NET)
    #   run: |
    #     # Begin SonarQube analysis
    #     sudo docker exec $(docker ps -q -f name=fityoufood-app) dotnet tool install --global dotnet-sonarscanner
    #     sudo docker exec $(docker ps -q -f name=fityoufood-app) echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH
    #     sudo docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner begin \
    #       /k:"fityoufood-backend" \
    #       /d:sonar.host.url="${{ secrets.SONARQUBE_HOST }}" \
    #       /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"
    #     docker exec $(docker ps -q -f name=fityoufood-app) dotnet build
    #     docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    - name: Tag and Push Docker Image
      run: |
        docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

    - name: Verify Metrics Endpoint
      run: |
        curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"

    - name: Verify Logging
      run: |
        curl -f http://localhost:8080/logging || echo "Logging endpoint not available"


    # Tear Down Services
    - name: Stop and Remove Services
      run: docker compose -f compose.yaml down
