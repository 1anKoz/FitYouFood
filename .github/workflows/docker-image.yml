name: Docker Compose CI/CD

# hi

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            - name: Build, start and test services
              run: docker compose -f compose.yaml up --build -d

            - name: Wait for Services to Start
              run: |
                  sleep 50
                  docker logs $(docker ps -q -f name=sonarqube)

            - name: Verify Metrics Endpoint
              run: |
                  curl -f http://localhost:8080/metrics || echo "Metrics endpoint not available"

            - name: Test SonarQube API
              run: |
                curl -X GET http://localhost:9000/api/settings/values || echo "SonarQube API is not reachable"

            # - name: SonarQube Analysis (.NET)
            #   run: |
            #       docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet sonarscanner begin /k:"backend-dotnet" /n:"Backend .NET" /d:sonar.host.url=http://sonarqube:9000 /d:sonar.login="admin"

            #       docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet build ./FitYouFood/FitYouFood.API.csproj

            #       docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="admin"


            - name: Tag and Push Docker Image
              run: |
                  docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
                  docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

            - name: Stop and Remove Services
              run: docker compose -f compose.yaml down

            - name: Download Logs from Loggly
              run: |
                curl -X GET "https://logs-01.loggly.com/api/search?" \
                     -H "Authorization: Bearer "d04ed58b-c853-4c74-9716-c6cfa2882a94"" \
                     -d "query=tag:prometheus" \
                     -d "from=now-1h" \
                     -d "to=now" \
                     -d "size=100" \
                     -o loggly_logs.json

                # Optionally, you can output the logs
                cat loggly_logs.json