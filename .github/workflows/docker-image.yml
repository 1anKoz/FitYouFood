name: Docker Compose CI/CD

# hi

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            - name: Build, start and test services
              run: docker compose -f compose.yaml up --build -d

            - name: Wait for Services to Start
              run: |
                  sleep 70
                  docker logs $(docker ps -q -f name=sonarqube)

            - name: SonarQube Analysis (.NET)
              run: |
                  docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner begin /k:"fityoufood-backend" /d:sonar.host.url=http://sonarqube:9000 /d:sonar.projectName="FitYouFood Backend" /d:sonar.projectVersion="1.0"

                  docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet build ./FitYouFood/FitYouFood.API.csproj

                  docker exec -i $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="sqp_e83681b13d9a9cdad5059b8890a3eafea020493e"

            - name: Verify Metrics Endpoint
              run: |
                  curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"

            - name: Tag and Push Docker Image
              run: |
                  docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
                  docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

            - name: Stop and Remove Services
              run: docker compose -f compose.yaml down
