name: Docker Compose CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Debugging: Verify file structure in the runner
    - name: Debug: List Files
      run: ls -R

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # Build and start services using Docker Compose
    - name: Build and Start Services
      run: docker compose -f compose.yaml up --build -d

    # Wait for services to start (optional but useful for dependent services)
    - name: Wait for Services to Start
      run: sleep 30

    # Run .NET tests in the container
    - name: Run .NET Backend Tests
      run: |
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet test --verbosity normal

    # Tag and push the Docker image to Docker Hub
    - name: Tag and Push Docker Image
      run: |
        docker tag fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

    # Verify application metrics endpoint
    - name: Verify Metrics Endpoint
      run: |
        curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"

    # Verify logging endpoint
    - name: Verify Logging
      run: |
        curl -f http://localhost:8080/logging || echo "Logging endpoint not available"

    # Tear down services to clean up resources
    - name: Stop and Remove Services
      run: docker compose -f compose.yaml down
