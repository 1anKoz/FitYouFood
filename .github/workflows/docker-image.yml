name: Docker Compose CI/CD

# hi

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build, start and test services
      run: docker compose -f compose.yaml up --build -d

    - name: Wait for Services to Start
      run: sleep 30

    - name: Wait for SonarQube
      run: |
        timeout=1000
        interval=10
        elapsed=0
        while ! curl -sf ${{ secrets.SONARQUBE_HOST }}/api/system/health | grep -q "GREEN"; do
          echo "Waiting for SonarQube to start... ($elapsed seconds elapsed)"
          echo "curl -sf ${{ secrets.SONARQUBE_HOST }}/api/system/health"
          sleep $interval
          elapsed=$((elapsed + interval))
          if [ $elapsed -ge $timeout ]; then
            echo "SonarQube did not start within $timeout seconds."
            echo "Check SonarQube logs for errors."
            docker logs $(docker ps -q -f name=sonarqube)
            exit 1
          fi
        done
        echo "SonarQube is ready!"

    - name: SonarQube Analysis (.NET)
      run: |
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet tool install --global dotnet-sonarscanner
        docker exec $(docker ps -q -f name=fityoufood-app) bash -c 'export PATH="$PATH:/root/.dotnet/tools" && echo $PATH'
        sudo docker exec $(docker ps -q -f name=fityoufood-app) echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH
        sudo docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner begin \
          /k:"fityoufood-backend" \
          /d:sonar.host.url="${{ secrets.SONARQUBE_HOST }}" \
          /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet build
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    - name: Verify Metrics Endpoint
      run: |
        curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"
    
    - name: Tag and Push Docker Image
      run: |
        docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

    - name: Stop and Remove Services
      run: docker compose -f compose.yaml down