name: Docker Compose CI/CD

# hi

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:
    # Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # Build and Start Services with Docker Compose
    - name: Build and Start Services
      run: docker compose -f compose.yaml up --build -d

    # Wait for services to be ready
    - name: Wait for Services to Start
      run: sleep 30

    - name: SonarQube Analysis (.NET)
      run: |
        # Begin SonarQube analysis
        sudo docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner begin \
          /k:"fityoufood-backend" \
          /d:sonar.host.url="${{ secrets.SONARQUBE_HOST }}" \
          /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet build
        docker exec $(docker ps -q -f name=fityoufood-app) dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    # Push Docker Image to Docker Hub
    - name: Tag and Push Docker Image
      run: |
        docker tag 1ankoz/fityoufood-app:latest ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fityoufood-app:latest

    # Verify Application Metrics Endpoint
    - name: Verify Metrics Endpoint
      run: |
        curl -f http://localhost:8080/actuator/metrics || echo "Metrics endpoint not available"

    # Verify Logging Configuration
    - name: Verify Logging
      run: |
        curl -f http://localhost:8080/logging || echo "Logging endpoint not available"
        
   # - name: Run .NET Backend Tests
    #  run: |
     #   # Ensure the .NET SDK is installed in the container before running tests
      #  docker exec $(docker ps -q -f name=fityoufood-app) apt-get update
       # docker exec $(docker ps -q -f name=fityoufood-app) apt-get install -y wget ca-certificates
       # docker exec $(docker ps -q -f name=fityoufood-app) wget https://packages.microsoft.com/config/debian/12/prod.list
       # docker exec $(docker ps -q -f name=fityoufood-app) mv prod.list /etc/apt/sources.list.d/microsoft-prod.list
       # docker exec $(docker ps -q -f name=fityoufood-app) wget -q https://packages.microsoft.com/keys/microsoft.asc -O- | sudo apt-key add -
       # docker exec $(docker ps -q -f name=fityoufood-app) apt-get update
       # docker exec $(docker ps -q -f name=fityoufood-app) apt-get install -y dotnet-sdk-8.0
       # docker exec $(docker ps -q -f name=fityoufood-app) dotnet test --no-build --verbosity normal

    # Tear Down Services
    - name: Stop and Remove Services
      run: docker compose -f compose.yaml down
